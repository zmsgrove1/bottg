services:
  - type: web
    name: ig-monitor
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: MYMEMORY_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: RESULTS_PER_ACCOUNT
        value: "1"
      - key: CONCURRENCY
        value: "5"