name: Check Instagram Posts

on:
  schedule:
    # 02:30 UTC = 07:30 по Астане (UTC+5). Поменяйте минуты/часы под себя.
    - cron: "30 2 * * *"
  workflow_dispatch: {}   # позволяет запускать вручную кнопкой в GitHub

jobs:
  check-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          RESULTS_PER_ACCOUNT: "1"
          CONCURRENCY: "5"
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python check_posts.py